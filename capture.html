<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>实时验证</title>
<script src="https://modao.cc/agent-py/static/source/js/tailwindcss.js"></script>
<script src="https://modao.cc/agent-py/static/source/js/iconify-icon.min.js"></script>
<style>
        :root {
            --qt-blue: #1677c8;
            --qt-blue-dark: #075b9e;
            --qt-border: #cbd5df;
            --qt-panel: #f8fafc;
            --qt-title: #e9eff5;
        }
        body {
            background-color: #e9edf2;
            font-family: "Microsoft YaHei", "SimHei", sans-serif;
            color: #333;
        }
        .qt-card {
            background: white;
            border: 1px solid var(--qt-border);
            border-radius: 6px;
            box-shadow: 0 2px 7px rgba(15, 23, 42, .07);
        }
        .qt-btn {
            background: #E1E1E1;
            border: 1px solid #ADADAD;
            padding: 4px 15px;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .qt-btn:hover {
            background: #E5F1FB;
            border-color: #0078D7;
        }
        .qt-btn:active {
            background: #CCE4F7;
        }
        .qt-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .qt-btn-primary {
            background: var(--qt-blue);
            color: white;
            border-color: #005A9E;
        }
        .qt-input {
            border: 1px solid #BDBDBD;
            padding: 4px 8px;
            font-size: 13px;
            outline: none;
            border-radius: 4px;
        }
        .qt-label {
            font-size: 13px;
            color: #444;
        }
        .qt-title {
            background: var(--qt-title);
            padding: 7px 11px;
            font-weight: bold;
            border-bottom: 1px solid var(--qt-border);
            font-size: 14px;
            color: #334155;
        }
        /* 表格样式 */
        .qt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .qt-table th {
            position: sticky;
            top: 0;
            z-index: 2;
            background: #eaf0f6;
            border: 1px solid #D0D0D0;
            padding: 8px;
            text-align: left;
            font-weight: 600;
        }
        .qt-table td {
            border: 1px solid #D0D0D0;
            padding: 6px 8px;
            background: white;
        }
        .qt-table tr:hover td {
            background: #F0F7FF;
        }
        .qt-table tr.record-row {
            cursor: pointer;
        }
        .qt-table tr.record-selected td {
            background: #DCEEFF;
        }
        .control-panel {
            background: transparent;
        }
        .verification-main {
            display: grid;
            grid-template-rows: 430px minmax(220px, 1fr);
            gap: 12px;
            min-height: calc(100vh - 3rem);
            overflow: visible;
        }
        .verification-workspace {
            display: grid;
            grid-template-columns: minmax(255px, 3fr) minmax(0, 7fr);
            gap: 12px;
            height: auto;
            min-height: 0;
        }
        .left-capture-panel,
        .right-preview-stack,
        .right-preview-stack > .qt-card {
            min-width: 0;
            min-height: 0;
        }
        .verification-records {
            min-height: 0;
        }
        .left-capture-content {
            display: grid;
            grid-template-rows: minmax(150px, .85fr) 1px minmax(190px, 1.15fr);
            min-height: 0;
            flex: 1;
            gap: 10px;
            overflow: visible;
            padding: 10px;
        }
        .control-subsection {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #dbe4ed;
            border-radius: 5px;
            background: #f8fafc;
            padding: 12px;
        }
        .subsection-heading {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
            color: #475569;
            font-size: 14px;
            font-weight: 700;
        }
        .task-status-row {
            display: flex;
            min-width: 0;
            align-items: center;
            font-size: 13px;
        }
        .task-actions {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            gap: 7px;
            margin-top: auto;
            padding-top: 12px;
        }
        .control-divider {
            height: 1px;
            background: #dbe4ed;
        }
        .right-preview-stack {
            display: grid;
            grid-template-rows: minmax(0, 1fr);
            gap: 12px;
        }
        .detail-card-content {
            display: flex;
            min-height: 0;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            background: #f8fafc;
            padding: 10px;
        }
        .detail-card-content .plate-result-card {
            flex: none;
        }
        .detail-card-content .detail-meta {
            flex: 1;
            min-height: 0;
        }
        .detail-card-content .review-panel {
            flex: none;
        }
        .detail-card-title {
            min-height: 34px;
        }
        .current-detail-card {
            --detail-columns: minmax(0, 1.58fr) minmax(132px, .42fr);
        }
        .detail-status-badge {
            display: inline-flex;
            min-width: 0;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 0;
            background: transparent;
            padding: 0;
            color: #64748b;
            font-size: 14px;
            font-weight: 700;
        }
        .detail-status-badge > span {
            justify-content: center;
        }
        .detail-status-badge iconify-icon {
            font-size: 16px;
        }
        .detail-primary-grid {
            display: grid;
            flex: 1;
            min-height: 0;
            grid-template-columns: var(--detail-columns);
            align-items: stretch;
            gap: 10px;
        }
        .detail-primary-grid .plate-preview-frame {
            height: auto;
            min-height: 82px;
        }
        .detail-primary-grid .plate-result-copy {
            align-items: center;
            border: 1px solid #d5dee8;
            border-radius: 5px;
            background: #fff;
            padding: 7px 10px;
        }
        .detail-primary-grid .plate-number {
            min-width: 0;
            padding: 7px 8px;
            font-size: 17px;
        }
        .current-detail-card .detail-meta {
            display: grid;
            flex: none;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: minmax(44px, 1fr);
            gap: 8px;
            margin-top: 8px;
        }
        .current-detail-card .detail-meta-row {
            min-height: 44px;
        }
        .detail-action-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            min-width: 0;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .detail-action-row .review-panel {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-column: span 2;
            width: 100%;
            min-width: 0;
            align-items: center;
            gap: 5px;
            margin-top: 0;
        }
        .detail-action-row .review-panel > span,
        .detail-action-row .review-panel .review-tag {
            width: 100%;
            min-width: 0;
        }
        .detail-action-row .review-options {
            display: contents;
        }
        .detail-action-row .review-btn {
            width: 100%;
            min-width: 0;
            padding-right: 8px;
            padding-left: 8px;
        }
        .detail-navigation {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-column: 3;
            width: 100%;
            min-width: 0;
            gap: 5px;
            margin-left: 0;
        }
        .detail-navigation .qt-btn {
            width: 100%;
            min-width: 0;
            padding-right: 8px;
            padding-left: 8px;
        }
        .left-capture-content .qt-btn,
        .detail-action-row .qt-btn {
            height: 30px;
            padding-top: 4px;
            padding-bottom: 4px;
            font-size: 13px;
            line-height: 1.2;
        }
        .detail-action-row .review-panel > span,
        .detail-action-row .review-tag {
            height: 30px;
        }
        .detail-action-row .review-tag {
            padding-top: 4px;
            padding-bottom: 4px;
            font-size: 13px;
        }
        .record-full-image-cell {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }
        .record-full-image-cell .record-view-full-btn {
            flex: none;
        }
        .aligned-module-grid {
            display: grid;
            grid-template-columns: minmax(0, 34fr) minmax(0, 66fr);
            gap: 12px;
        }
        .segment-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .segment-surface {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            min-height: 30px;
            padding: 4px 10px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            cursor: pointer;
            transition: all .18s ease;
        }
        .segment-option input:checked + .segment-surface {
            border-color: #2786d8;
            background: #e8f4ff;
            color: #075b9e;
            box-shadow: inset 0 0 0 1px rgba(39,134,216,.1);
            font-weight: 700;
        }
        .plate-crop {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform .2s ease;
        }
        .plate-result-card {
            display: grid;
            grid-template-columns: minmax(150px, 1.25fr) minmax(125px, .75fr);
            gap: 8px;
            width: 100%;
            border: 1px solid #d5dee8;
            border-radius: 6px;
            background: white;
            padding: 6px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .06);
        }
        .plate-preview-frame {
            height: 56px;
            border: 1px solid #aebdca;
            border-radius: 4px;
            background: #111827;
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .08);
        }
        .result-placeholder {
            display: flex;
            height: 100%;
            width: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
        }
        .result-placeholder iconify-icon {
            color: #64748b;
            font-size: 28px;
        }
        .table-image-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            color: #94a3b8;
            font-size: 10px;
            text-align: center;
        }
        .plate-result-copy {
            display: flex;
            min-width: 0;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
        }
        .plate-result-caption {
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }
        .plate-number {
            width: 100%;
            overflow: hidden;
            border: 1px solid #76a9d2;
            border-radius: 4px;
            background: linear-gradient(180deg, #eaf5ff 0%, #d9edfc 100%);
            padding: 7px 8px;
            color: #075b9e;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: .04em;
            line-height: 1;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .image-pan-stage {
            position: relative;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .image-pan-target {
            transform-origin: center center;
            transition: transform .16s ease;
            will-change: transform;
            user-select: none;
            -webkit-user-drag: none;
        }
        .image-pan-target.is-zoomed {
            cursor: grab;
        }
        .image-pan-target.is-dragging {
            cursor: grabbing;
            transition: none !important;
        }
        .zoom-readout {
            min-width: 48px;
            color: #475569;
            font-size: 12px;
            text-align: center;
        }
        .viewer-dialog {
            width: min(78vw, 1120px) !important;
            max-width: 94vw;
        }
        .viewer-meta-bar {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            border: 1px solid #dbe4ed;
            border-radius: 4px;
            background: #f8fafc;
            padding: 10px 14px;
            color: #334155;
            font-size: 14px;
            line-height: 1.5;
        }
        .viewer-meta-bar b {
            margin-right: 8px;
            color: #64748b;
            font-weight: 600;
        }
        #loopSvg {
            touch-action: none;
        }
        #loopSvg .loop-handle {
            pointer-events: all;
            cursor: move;
        }
        .loop-editor-stage {
            position: relative;
            height: min(58vh, 560px);
            overflow: hidden;
            border: 1px solid #64748b;
            border-radius: 4px;
            background: #0f172a;
            touch-action: none;
        }
        .loop-editor-stage img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            user-select: none;
            -webkit-user-drag: none;
        }
        .loop-editor-stage svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        .loop-editor-stage .loop-editor-handle {
            cursor: move;
        }
        .capture-pulse {
            animation: capturePulse 1.2s ease-in-out infinite;
        }
        .progress-track {
            height: 14px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #e2e8f0;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, .12);
        }
        .progress-fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            transition: width .25s ease;
        }
        @keyframes capturePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .config-label {
            margin-bottom: 5px;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
        }
        .loop-status {
            border: 1px solid #dbe4ed;
            border-radius: 4px;
            background: #f8fafc;
            padding: 8px 9px;
            color: #475569;
            font-size: 13px;
        }
        .detail-meta {
            display: grid;
            flex: 1;
            min-height: 0;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 6px;
            width: 100%;
        }
        .detail-meta-row {
            display: flex;
            min-width: 0;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            border: 1px solid #dbe4ed;
            border-radius: 5px;
            background: white;
            padding: 5px 9px;
            font-size: 13px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
        }
        .detail-meta-row > span:first-child {
            color: #64748b;
            font-weight: 500;
        }
        .detail-value {
            overflow: hidden;
            color: #1f2937;
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .record-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .record-toolbar > div:first-child {
            flex: 1 1 280px;
            min-width: 0;
        }
        .record-toolbar > div:last-child {
            display: flex;
            flex: 0 1 auto;
            min-width: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .validation-context-bar {
            display: grid;
            grid-template-columns: auto repeat(5, minmax(0, 1fr)) auto;
            align-items: center;
            gap: 10px;
            padding: 8px 11px;
        }
        .context-item {
            min-width: 0;
            border-left: 1px solid #dbe4ed;
            padding-left: 10px;
        }
        .context-item span {
            display: block;
            color: #64748b;
            font-size: 10px;
        }
        .context-item b {
            display: block;
            overflow: hidden;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .review-panel {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 7px;
            margin-top: 6px;
        }
        .review-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 5px;
        }
        .review-btn.is-active {
            border-color: #2786d8;
            background: #e8f4ff;
            color: #075b9e;
            font-weight: 700;
        }
        .review-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 56px;
            border: 1px solid #cbd5e1;
            border-radius: 999px;
            background: #f8fafc;
            padding: 2px 7px;
            color: #64748b;
            font-size: 11px;
            white-space: nowrap;
        }
        .review-tag.correct { border-color: #9bcaaa; background: #f0f9f3; color: #16803c; }
        .review-tag.error, .review-tag.missed { border-color: #dfa0a0; background: #fdf2f2; color: #b42318; }
        .verification-records .qt-table {
            font-size: 13px;
            min-width: 980px;
        }
        .verification-records .qt-table .qt-btn,
        .verification-records .qt-table .review-tag,
        .verification-records .qt-table .table-image-placeholder {
            font-size: 13px;
        }
        .summary-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border: 1px solid #dbe4ed;
            border-radius: 999px;
            background: #fff;
            padding: 2px 7px;
            color: #475569;
            font-size: 11px;
            font-weight: 500;
        }
        #modalOverlay {
            overflow-y: auto;
            padding: 16px;
        }
        #modalPanel {
            display: flex;
            max-height: calc(100vh - 32px);
            flex-direction: column;
        }
        #modalBody {
            min-height: 0;
            overflow-y: auto;
        }
        @media (max-width: 900px) {
            .verification-workspace {
                grid-template-columns: minmax(220px, 34fr) minmax(0, 66fr);
            }
            .record-toolbar > div:last-child {
                flex: 1 1 100%;
                justify-content: flex-start;
            }
        }
        @media (max-width: 700px) {
            header {
                height: auto !important;
                min-height: 3rem;
                flex-wrap: wrap;
                gap: 6px 16px;
                padding-top: 8px;
                padding-bottom: 8px;
            }
            .verification-main {
                display: block;
                min-height: 0;
                overflow: visible;
            }
            .verification-workspace {
                height: auto;
                min-height: 0;
                grid-template-columns: 1fr;
            }
            .left-capture-panel {
                min-height: 0;
            }
            .left-capture-content {
                grid-template-rows: auto 1px auto;
            }
            .right-preview-stack {
                min-height: 360px;
                grid-template-rows: auto;
            }
            .current-detail-card {
                min-height: 360px;
            }
            .detail-card-content {
                overflow: visible;
            }
            .detail-action-row {
                grid-template-columns: 1fr;
            }
            .detail-action-row .review-panel,
            .detail-navigation {
                grid-column: auto;
            }
            .verification-records {
                min-height: 300px;
                margin-top: 12px;
            }
            .record-toolbar > div:first-child,
            .record-toolbar > div:last-child {
                flex-basis: 100%;
            }
            .record-toolbar > div:last-child {
                justify-content: flex-start;
            }
        }
        @media (max-width: 480px) {
            .detail-primary-grid {
                grid-template-columns: 1fr;
            }
            .current-detail-card {
                min-height: 440px;
            }
            .current-detail-card .detail-meta {
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, minmax(44px, auto));
            }
            .viewer-dialog {
                width: 94vw !important;
            }
            .viewer-meta-bar {
                grid-template-columns: 1fr;
            }
            .loop-editor-stage {
                height: min(48vh, 420px);
            }
        }
        @media (max-width: 1180px) {
            .validation-context-bar { grid-template-columns: auto repeat(3, minmax(0, 1fr)); }
            .validation-context-bar .context-item:nth-child(5),
            .validation-context-bar .context-item:nth-child(6) { display: none; }
        }
    </style>
</head>
<body class="min-h-screen overflow-auto flex flex-col">
<!-- 顶部标题栏 -->
<header class="h-12 bg-[#2D2D2D] text-white flex items-center justify-between px-6 flex-none">
<div class="flex items-center space-x-3">
<a class="qt-btn px-3 py-1 bg-gray-600 border-gray-500 text-white hover:bg-gray-500" href="plate-capture-system_main.html" onclick="return leaveRealtimeValidation()">
<iconify-icon class="mr-1" icon="mdi:chevron-left"></iconify-icon>
                返回验证准备
            </a>
<span class="text-lg font-bold tracking-wider ml-4">实时验证</span>
</div>
<div class="flex items-center gap-4 text-xs text-gray-400"><span>验证状态：<b class="font-normal text-blue-300" id="headerValidationStatus">未开始</b></span><span>系统时间：<span id="systemTime">--</span></span></div>
</header>
<!-- 主体内容 -->
<main class="flex-1 min-h-0 p-4 verification-main">
<!-- 抓拍验证工作区：左侧任务与配置，右侧详情与全景图 -->
<section class="verification-workspace flex-none">
<div class="qt-card left-capture-panel flex flex-col overflow-hidden">
<div class="qt-title flex items-center gap-1.5"><iconify-icon class="text-base text-blue-600" icon="mdi:radar"></iconify-icon>抓拍任务与配置</div>
<div class="left-capture-content">
<div class="control-subsection">
<div class="subsection-heading"><iconify-icon class="text-blue-600" icon="mdi:play-circle-outline"></iconify-icon>抓拍任务</div>
<div class="task-status-row">
<span class="mr-2 inline-block h-2.5 w-2.5 flex-none rounded-full bg-gray-400" id="captureStatusDot"></span>
